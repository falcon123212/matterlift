<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatterLift</title>
  </head>
  <body>
    <header>
      <h1>MatterLift</h1>
      <p class="tagline">Point at anything. Say what you want. Get a game-ready material.</p>
    </header>
    <main>
      <form id="request">
        <label>What do you want? Type it, say it, or both
          <textarea name="text" rows="3" placeholder="old oak planks, worn and slightly scratched"></textarea>
        </label>
        <div class="voice">
          <button type="button" id="mic" aria-pressed="false">🎤 Speak</button>
          <span id="voice-state" class="muted small"></span>
          <button type="button" id="voice-clear" class="link" hidden>remove</button>
        </div>
        <label>Photo of the real surface (optional)
          <input type="file" name="photo" accept="image/*" />
        </label>
        <label class="check">
          <input type="checkbox" name="library" id="library-mode" disabled />
          Every material in this photo (library)
        </label>
        <label>Resolution
          <select name="size">
            <option>512</option>
            <option selected>1024</option>
            <option>2048</option>
          </select>
        </label>
        <button type="submit">Generate</button>
        <p id="status" role="status"></p>
      </form>

      <section class="viewer">
        <div id="canvas-wrap"></div>
        <div class="controls">
          <div class="group" id="shapes">
            <button data-shape="sphere" class="on">Sphere</button>
            <button data-shape="cube">Cube</button>
            <button data-shape="plane">Plane</button>
          </div>
          <div class="group" id="lights">
            <button data-light="hdri" class="on">HDRI</button>
            <button data-light="key">Key</button>
            <button data-light="raking">Raking</button>
            <button data-light="back">Back</button>
          </div>
          <div class="group" id="aovs" role="group" aria-label="Render pass (AOV)">
            <button data-aov="beauty" class="on">Beauty</button>
            <button data-aov="depth">Depth</button>
            <button data-aov="normal">Normal</button>
            <button data-aov="albedo">Albedo</button>
            <button data-aov="roughness">Rough</button>
            <button data-aov="ao">AO</button>
          </div>
          <button type="button" id="snapshot">Save PNG</button>
        </div>
      </section>

      <section class="side">
        <div id="understanding" hidden>
          <h2>What MatterLift understood</h2>
          <img id="und-overlay" alt="The photo with the surface SAM masked and the square sampled from it" />
          <p id="und-text" class="small"></p>
          <div id="und-items"></div>
        </div>
        <div id="fidelity" hidden>
          <h2>Photo vs material</h2>
          <div class="pair">
            <figure><img id="fid-photo" alt="The photo sample" /><figcaption>photo sample</figcaption></figure>
            <figure><img id="fid-albedo" alt="The generated albedo" /><figcaption>albedo</figcaption></figure>
          </div>
          <p id="fid-text" class="small"></p>
        </div>
        <h2>Export</h2>
        <div class="export">
          <select id="export-size" aria-label="Export resolution">
            <option value="512">512</option>
            <option value="1024">1K</option>
            <option value="2048" selected>2K</option>
            <option value="4096">4K</option>
          </select>
          <select id="export-fmt" aria-label="Export format">
            <option value="png" selected>PNG</option>
            <option value="jpg">JPG</option>
          </select>
          <a id="export-link" class="button disabled" download>Download .zip</a>
        </div>
        <p class="muted small">Color, NormalGL/DX, Roughness, AO, Displacement · Godot .tres · MaterialX · USD</p>
        <h2>Tiling 3×3</h2>
        <div id="tiling"></div>
        <h2>Maps</h2>
        <div id="maps"></div>
        <h2>Scores</h2>
        <table id="scores"></table>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
