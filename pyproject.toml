[project]
name = "matterlift"
version = "0.1.0"
description = "Point at anything. Say what you want. Get a game-ready material."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy", "scipy", "pillow",
  "fastapi", "uvicorn[standard]", "python-multipart",
  "openai", "httpx", "python-dotenv", "pydantic",
  "vercel",  # Vercel Blob, used only when a store is connected (the Vercel deployment)
]

[project.optional-dependencies]
dev = ["pytest", "MaterialX", "usd-core"]

[tool.setuptools]
packages = ["pbrforge", "matterlift_api"]
package-dir = { "pbrforge" = "pbrforge", "matterlift_api" = "matterlift_api" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Vercel: the FastAPI app, with the built page (web/dist) served from Vercel's CDN.
[tool.vercel]
entrypoint = "matterlift_api.main:app"

[tool.vercel.fastapi.static]
cdn = true  # the CORS middleware would otherwise keep the page in the function
exclude = true  # and out of the function bundle
